# The whole FineVines publish path, unattended.
#
#   drain the review queue -> enrich -> source images -> build -> deploy
#   -> commit the state back -> email the digest
#
# The repo stays the source of truth. Nothing here holds state between runs
# except what it commits: data/, the imported photographs, and
# .bunny-manifest.json. That is what makes a run resumable and what stops
# enrichment being re-billed — the SourceHash of every wine survives in
# data/wines.json, so an unchanged wine is never sent to OpenAI twice.
#
# There is deliberately NO pull_request trigger. The repo is public and this
# workflow reads every credential the business has; a fork PR must never be able
# to start it. Build and test coverage for pull requests lives in ci.yml, which
# declares no secrets at all.
name: pipeline

on:
  push:
    branches: [master]
  # Nightly at 08:15 UTC — about 2:15am Central, well clear of the Salesforce
  # org's business hours and of any human pushing.
  schedule:
    - cron: '15 8 * * *'
  workflow_dispatch:
  # Fired by the review console's Edge Script the moment a reviewer submits a
  # change, so their fix is live in minutes rather than at the next nightly run.
  repository_dispatch:
    types: [review-console]

# Runs QUEUE, never overlap. Two concurrent runs would race the deploy manifest
# and the commit-back push, and cancel-in-progress would abandon a run
# mid-upload — which the deploy invariants survive, but only because they are
# never asked to.
concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write # the bot commit-back pushes to master

jobs:
  run:
    # A redundant restatement of GitHub's own rule, and nothing more. GitHub
    # already skips a push whose head commit message contains [skip ci], which
    # is what stops the bot's own commit from re-triggering this workflow; this
    # guard re-checks the same string so the protection is visible in the file
    # rather than only in GitHub's behaviour, and so it survives that rule being
    # disabled. It does NOT extend the protection to the other triggers:
    # github.event.head_commit is null on schedule, workflow_dispatch and
    # repository_dispatch, contains() reads null as the empty string, and the
    # guard passes. That is deliberate — a schedule or a reviewer's dispatch
    # firing right after a bot commit SHOULD run. Redoing work that just landed
    # is close to free: SourceHash means no unchanged wine is re-sent to OpenAI,
    # the attempt ledger means no image is re-fetched, and the manifest diff
    # means nothing is re-uploaded.
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 300

    env:
      # Salesforce — the authoritative source for every commercial field.
      FINEVINES_SF_BASE_URL: ${{ secrets.FINEVINES_SF_BASE_URL }}
      FINEVINES_SF_CLIENT_ID: ${{ secrets.FINEVINES_SF_CLIENT_ID }}
      FINEVINES_SF_CLIENT_SECRET: ${{ secrets.FINEVINES_SF_CLIENT_SECRET }}
      # OpenAI — web-search enrichment, vision label reading, watermark sweep.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # Google Custom Search image endpoint. The key must permit server-side
      # Custom Search JSON API calls; a browser-referer-only key is invalid here.
      FINEVINES_GOOGLE_CSE_KEY: ${{ secrets.FINEVINES_GOOGLE_CSE_KEY }}
      FINEVINES_GOOGLE_CSE_CX: ${{ secrets.FINEVINES_GOOGLE_CSE_CX }}
      # Bunny.net — storage zone (deploy upload + the _review/ queue), pull zone
      # purge, and the redirect middleware's script ID.
      FINEVINES_BUNNY_STORAGE_ZONE: ${{ secrets.FINEVINES_BUNNY_STORAGE_ZONE }}
      FINEVINES_BUNNY_STORAGE_KEY: ${{ secrets.FINEVINES_BUNNY_STORAGE_KEY }}
      FINEVINES_BUNNY_STORAGE_ENDPOINT: ${{ secrets.FINEVINES_BUNNY_STORAGE_ENDPOINT }}
      FINEVINES_BUNNY_API_KEY: ${{ secrets.FINEVINES_BUNNY_API_KEY }}
      FINEVINES_BUNNY_PULL_ZONE_ID: ${{ secrets.FINEVINES_BUNNY_PULL_ZONE_ID }}
      FINEVINES_BUNNY_SCRIPT_ID: ${{ secrets.FINEVINES_BUNNY_SCRIPT_ID }}
      # Site.
      FINEVINES_SITE_BASE_URL: ${{ secrets.FINEVINES_SITE_BASE_URL }}
      FINEVINES_GA_ID: ${{ secrets.FINEVINES_GA_ID }}
      # Digest email — submission through the client's SMTP relay.
      FINEVINES_SMTP_HOST: ${{ secrets.FINEVINES_SMTP_HOST }}
      FINEVINES_SMTP_PORT: ${{ secrets.FINEVINES_SMTP_PORT }}
      FINEVINES_SMTP_USER: ${{ secrets.FINEVINES_SMTP_USER }}
      FINEVINES_SMTP_PASS: ${{ secrets.FINEVINES_SMTP_PASS }}
      FINEVINES_NOTIFY_TO: ${{ secrets.FINEVINES_NOTIFY_TO }}
      FINEVINES_NOTIFY_FROM: ${{ secrets.FINEVINES_NOTIFY_FROM }}

    steps:
      # Full depth: the commit-back rebases onto origin/master if a human pushed
      # mid-run, and a shallow clone cannot rebase.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Match ci.yml. The unattended publisher runs the unit suite before any
      # catalog mutation, and Node 20 supports the directory form used by the
      # repository's node:test scripts.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-image.txt

      - name: Install local image-comparison runtime
        run: python -m pip install -r requirements-image.txt

      # --ignore-scripts: every secret above is job-level env, so an install
      # script would run with the Salesforce credentials, the OpenAI key, the
      # Bunny keys and the SMTP relay password in its environment, on a public repo.
      # The only runtime dependency is puppeteer-core, which has no meaningful
      # install script — so closing that path costs nothing.
      - run: npm ci --ignore-scripts

      # Prove the checked-out revision before any command writes data/. A
      # broken matcher, ledger, import rule, or deploy invariant cannot publish.
      - name: Verify the pipeline revision
        run: |
          npm run test:unit
          go test ./...

      - name: Build the binaries
        run: |
          go build -ldflags "-s -w" -o finevines ./cmd/finevines
          go build -o imgcheck ./tools/imgcheck
          go build -o imghash ./tools/imghash
          go build -o imgnorm ./tools/imgnorm

      # The catalog as it stands BEFORE anything runs. `notify` diffs against
      # this at the end. Taken here rather than derived from git later, because
      # by then the commit-back has landed and HEAD is the after-state.
      #
      # UNCONDITIONAL, and ahead of every step that writes data/: if this
      # snapshot is missing or stale, notify's diff sees an empty "before" and
      # mails the client the ENTIRE catalog as new — 2,600-odd wines. Everything
      # between checkout and here only installs toolchains and compiles; nothing
      # that touches data/ may ever be inserted above this step, and this step
      # must never be made conditional.
      - name: Snapshot the catalog for the digest
        run: |
          mkdir -p .run
          cp data/wines.json .run/wines-before.json

      # 1. Drain the review console's change queue. First, so a reviewer's fix
      #    is applied before enrich has a chance to overwrite the same wine, and
      #    so a text-feedback regeneration is the version that gets built.
      - name: Apply the review queue
        run: ./finevines applyqueue -runlog .run/queue-applied.json

      # 2. Enrich against live Salesforce. SourceHash means unchanged wines are
      #    not re-sent to OpenAI, so this is cheap on a normal night.
      - name: Enrich
        run: ./finevines enrich

      # 3. Source bottle photographs: fetch + verify, watermark sweep, import
      #    survivors. Both verification stages are hard gates. Deliberately
      #    The runner attempts the complete due backlog. It remains bounded by
      #    its two-hour wall-clock budget so it cannot consume the whole job
      #    timeout and lose the ledger writes that make it converge.
      - name: Source images
        run: node tools/labelfetch/autonomous.mjs --apply

      # The runner is disposable; retain the stage-by-stage receipt even when
      # the image workflow fails. This is operational evidence, not catalog
      # state, so it belongs in a workflow artifact rather than a bot commit.
      - name: Retain the image workflow receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-workflow-${{ github.run_id }}
          path: .run/image-workflow.json
          if-no-files-found: ignore
          retention-days: 30

      # 4. Build the static site.
      - name: Build
        run: ./finevines build

      # 5. Deploy. The manifest diff means only changed files upload; the
      #    manifest is saved only after every upload and delete succeeds, and the
      #    purge only after that (see deploy.Run's ordering invariants).
      - name: Deploy
        run: ./finevines deploy

      # 6. Commit the state back. AFTER the deploy, so the repo never claims to
      #    have published something that failed to upload — the same invariant
      #    deploy.Run applies to its own manifest, extended one level up.
      #
      #    The `git add` is pathspec-limited on purpose and must stay that way.
      #    `git add -A` would sweep in the Linux helper binaries built above:
      #    .gitignore only lists imgcheck.exe/imgnorm.exe/finevines.exe, so the
      #    bare `finevines`, `imgcheck` and `imgnorm` left at the repo root are
      #    untracked-but-not-ignored, and a broad add would commit three
      #    binaries to master every night.
      - name: Commit the run's state back to master
        run: bash tools/pipeline/commitback.sh

      # 7. Email the digest — only if the run changed something. Runs last so it
      #    reports what actually shipped, and is NOT `if: always()`: a failed run
      #    surfaces through GitHub's own workflow-failure email to the repo
      #    owner. This email is for content changes, not CI health.
      #
      #    DO NOT USE "Re-run failed jobs" ONCE THE COMMIT-BACK HAS LANDED.
      #    This is the only step after it, so the failure that sends you to the
      #    re-run button is usually this one — and a re-run is silently wrong.
      #    A re-run checks out a master that ALREADY contains the bot commit, so
      #    the snapshot above captures the AFTER state, Diff finds nothing,
      #    notify takes its quiet "changed nothing" path and the job goes green
      #    without an email — on the exact night an email mattered most.
      #    Re-send by hand instead, from a checkout, with the wines.json from the
      #    commit BEFORE the bot's:
      #
      #      git show <bot-commit>~1:data/wines.json > /tmp/before.json
      #      ./finevines notify -before /tmp/before.json   # add -dry to preview
      #
      #    (Runbook: docs/operations.md, per Task 9.)
      - name: Send the digest
        run: ./finevines notify -before .run/wines-before.json -applied .run/queue-applied.json
