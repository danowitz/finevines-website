name: image recovery canary

on:
  workflow_dispatch:
    inputs:
      sample_size:
        description: Prior misses to retry
        required: true
        default: '30'
        type: choice
        options: ['10', '30', '100']
      budget_minutes:
        description: Maximum runtime for image search
        required: true
        default: '30'
        type: choice
        options: ['15', '30', '60']

concurrency:
  group: image-recovery-canary
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FINEVINES_GOOGLE_CSE_KEY: ${{ secrets.FINEVINES_GOOGLE_CSE_KEY }}
      FINEVINES_GOOGLE_CSE_CX: ${{ secrets.FINEVINES_GOOGLE_CSE_CX }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-image.txt

      - name: Install image runtime
        run: |
          python -m pip install -r requirements-image.txt
          npm ci --ignore-scripts

      - name: Verify and build image tools
        run: |
          node --test tests/unit/autonomous-workflow.test.js
          go test ./tools/...
          go build -o imgcheck ./tools/imgcheck
          go build -o imghash ./tools/imghash
          go build -o imgnorm ./tools/imgnorm

      - name: Retry prior misses
        run: >-
          node tools/labelfetch/autonomous.mjs
          --canary
          --retry-misses
          --n "${{ inputs.sample_size }}"
          --budget-minutes "${{ inputs.budget_minutes }}"

      - name: Upload review package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-recovery-canary-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            .run/image-workflow.json
            out-bottle/image-canary.json
            out-bottle/image-canary.html
            data/fetched-images/candidates/
            data/fetched-images/*.png
