name: review-console-test-action

on:
  repository_dispatch:
    types: [review-console]

permissions:
  contents: read

concurrency:
  group: review-console-test-actions
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ github.event.client_payload.environment == 'test' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FINEVINES_REVIEW_ENVIRONMENT: test
      FINEVINES_REVIEW_STORAGE_ZONE: ${{ secrets.FINEVINES_REVIEW_STORAGE_ZONE }}
      FINEVINES_REVIEW_STORAGE_KEY: ${{ secrets.FINEVINES_REVIEW_STORAGE_KEY }}
      FINEVINES_REVIEW_STORAGE_ENDPOINT: ${{ secrets.FINEVINES_REVIEW_STORAGE_ENDPOINT }}
      FINEVINES_SITE_BASE_URL: https://finevines.biz
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate dispatch contract
        env:
          REVIEW_ACTION_ID: ${{ github.event.client_payload.actionId }}
        run: '[[ "$REVIEW_ACTION_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]'
      - name: Build action processor
        run: |
          go build -ldflags "-s -w" -o finevines ./cmd/finevines
          go build -o imgnorm ./tools/imgnorm
      - name: Prepare and build without changing a live site
        run: |
          ./finevines reviewapply -environment test -decisions .run/review-decisions.json -applied .run/queue-applied.json
          ./finevines build
          printf '{"schemaVersion":1,"wines":[]}\n' > .run/review-draft.json
          node tools/labelfetch/publish-review-package.mjs --environment test
      - name: Write validation-only receipts
        run: ./finevines reviewfinalize -environment test -decisions .run/review-decisions.json -prepared-status validated -target validation-only -run-id "$GITHUB_RUN_ID"
