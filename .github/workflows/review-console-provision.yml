name: review-console-provision

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-console-provision
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: review-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Reconcile Bunny review infrastructure
        env:
          FINEVINES_BUNNY_API_KEY: ${{ secrets.FINEVINES_BUNNY_API_KEY }}
          FINEVINES_REVIEW_STORAGE_ENDPOINT: ${{ secrets.FINEVINES_REVIEW_STORAGE_ENDPOINT }}
          FINEVINES_REVIEW_STORAGE_ZONE: ${{ secrets.FINEVINES_REVIEW_STORAGE_ZONE }}
          FINEVINES_REVIEW_STORAGE_KEY: ${{ secrets.FINEVINES_REVIEW_STORAGE_KEY }}
          FINEVINES_REVIEW_DATABASE_URL: ${{ secrets.FINEVINES_REVIEW_DATABASE_URL }}
          FINEVINES_REVIEW_DATABASE_TOKEN: ${{ secrets.FINEVINES_REVIEW_DATABASE_TOKEN }}
          FINEVINES_REVIEW_GITHUB_DISPATCH_TOKEN: ${{ secrets.FINEVINES_REVIEW_GITHUB_DISPATCH_TOKEN }}
          FINEVINES_REVIEW_TEST_SESSION_SECRET: ${{ secrets.FINEVINES_REVIEW_TEST_SESSION_SECRET }}
          FINEVINES_REVIEW_PRODUCTION_SESSION_SECRET: ${{ secrets.FINEVINES_REVIEW_PRODUCTION_SESSION_SECRET }}
        run: node tools/review-console/provision.mjs
